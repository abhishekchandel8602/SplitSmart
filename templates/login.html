{% extends "base.html" %}
{% block title %}Log in · SplitSmart{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-copy"><span class="eyebrow">Welcome back</span><h1>Your shared expenses,<br><em>beautifully clear.</em></h1><p>Pick up exactly where your group left off.</p></div>
  <form class="card auth-card" method="post">
    <h2>Log in</h2><p class="muted">Good to see you again.</p>
    <label>Email<input type="email" name="email" placeholder="you@example.com" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="button button-full" type="submit">Log in</button>
    <p class="form-foot">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
